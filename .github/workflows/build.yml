# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      # Gradle/Loom itself needs JDK 25 (fabric-loom 1.18.1 requires a Java 25
      # runtime), while the mod classes are compiled with the toolchain from
      # gradle.properties (21 for MC 1.21.1). Both JDKs must be present.
      - name: setup jdk (gradle runtime + project toolchain)
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'microsoft'
      - name: register java 21 toolchain
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$JAVA_HOME_21_X64" >> "$HOME/.gradle/gradle.properties"
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar

