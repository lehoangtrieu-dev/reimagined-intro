plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

// Guards the crash reported in issue #4: when a mixin config asks for a newer
// compatibilityLevel than the Java version the mod targets, Mixin aborts during
// initialisation (e.g. "JAVA_25 could not be set" on a Java 21 runtime) and the
// game never reaches the main menu. Failing the build is far cheaper than
// shipping a jar that cannot start.
def mixinConfigFile = file("src/main/resources/${mod_id}.mixins.json")
if (mixinConfigFile.exists()) {
    def expectedCompatibilityLevel = "JAVA_${java_version}"
    def verifyMixinCompatibilityLevel = tasks.register('verifyMixinCompatibilityLevel') {
        def configFile = mixinConfigFile
        def expected = expectedCompatibilityLevel
        def targetJavaVersion = java_version
        inputs.file(configFile)
        doLast {
            def level = new groovy.json.JsonSlurper().parse(configFile).compatibilityLevel
            if (level != expected) {
                throw new GradleException(
                        "${configFile.name} requests mixin compatibilityLevel '${level}', but this build targets Java " +
                                "${targetJavaVersion} (expected '${expected}'). Mixin would fail to initialise on a " +
                                "Java ${targetJavaVersion} runtime.")
            }
        }
    }
    tasks.named('processResources') {
        dependsOn verifyMixinCompatibilityLevel
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
